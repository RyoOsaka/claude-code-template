name: "Feature Request"
description: "新機能や改善の提案"
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        機能リクエストありがとうございます。
        以下のフォームに必要事項を記入してください。

  - type: textarea
    id: summary
    attributes:
      label: "機能の概要"
      description: "提案する機能を簡潔に説明してください"
      placeholder: "例: ダークモードの切り替え機能を追加したい"
    validations:
      required: true

  - type: textarea
    id: motivation
    attributes:
      label: "背景・動機"
      description: "なぜこの機能が必要ですか？どのような問題を解決しますか？"
      placeholder: |
        例: 夜間作業時に目が疲れるため、ダークモードがあると作業効率が向上する
    validations:
      required: true

  - type: textarea
    id: proposed-solution
    attributes:
      label: "提案する解決策"
      description: "どのように実装すべきか、具体的なアイデアがあれば記載してください"
      placeholder: |
        例:
        - 設定画面にテーマ切り替えトグルを追加
        - システム設定に連動するオプションも用意
    validations:
      required: true

  - type: textarea
    id: acceptance-criteria
    attributes:
      label: "受け入れ基準"
      description: "この機能が完成したと言えるための条件を記載してください"
      placeholder: |
        - [ ] ダークモードとライトモードを切り替えられる
        - [ ] 選択したテーマがローカルストレージに保存される
        - [ ] ページリロード後もテーマが維持される
    validations:
      required: false

  - type: dropdown
    id: priority
    attributes:
      label: "優先度"
      description: "この機能の重要度を選択してください"
      options:
        - "high: ビジネス上必須"
        - "medium: あると便利"
        - "low: 余裕があれば"
    validations:
      required: true

  - type: dropdown
    id: scope
    attributes:
      label: "影響範囲"
      description: "変更が影響する範囲を選択してください"
      multiple: true
      options:
        - "frontend"
        - "backend"
        - "database"
        - "api"
        - "infrastructure"
        - "documentation"
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: "代替案"
      description: "検討した他の解決策があれば記載してください"
    validations:
      required: false

  - type: textarea
    id: additional-context
    attributes:
      label: "補足情報"
      description: "参考資料、モックアップ、関連 Issue などがあれば記載してください"
    validations:
      required: false
